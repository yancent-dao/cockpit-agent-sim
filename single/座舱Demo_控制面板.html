<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>座舱模拟环境 · Demo Director</title>
<style>
:root{--bg:#0B0E14;--sf:#151A23;--el:#1E2530;--tx:#F2F5FA;--t2:#8A94A6;--t3:#5C6675;
  --brand:#4DA3FF;--ok:#3ED598;--warn:#FFB84D;--dg:#FF5C5C}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:9;background:rgba(11,14,20,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600}header .sub{font-size:12px;color:var(--t3)}
.sp{flex:1}
#dot{width:9px;height:9px;border-radius:50%;background:#3A4250;transition:.3s}
#dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
#connTxt{font-size:12px;color:var(--t2)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 22px 60px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
section{background:var(--sf);border-radius:16px;padding:16px 18px;margin-bottom:18px}
h2{font-size:11px;letter-spacing:1.8px;color:var(--t3);text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:8px}
h2 .n{background:var(--el);border-radius:5px;padding:1px 7px;font-size:10px;letter-spacing:0}
button{background:var(--el);color:#C9D2E0;border:1px solid rgba(255,255,255,.09);border-radius:10px;
  padding:9px 12px;font-size:13px;cursor:pointer;transition:.16s;font-family:inherit}
button:hover{background:#2A3340;color:#fff;border-color:rgba(77,163,255,.5)}
button.on,button.pri{background:var(--brand);color:#06121F;border-color:var(--brand);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{background:var(--el);color:#C9D2E0;border:1px solid rgba(255,255,255,.09);
  border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;width:100%}
input::placeholder{color:#4A5462}
.fld{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.fld label{width:70px;color:var(--t2);font-size:12px;flex:none}
.fld input[type=range]{accent-color:var(--brand);padding:0}
.fld .v{width:64px;text-align:right;color:#C9D2E0;font-variant-numeric:tabular-nums;font-size:12px;flex:none}
.row{display:flex;gap:8px;align-items:center}
.note{color:var(--t3);font-size:11.5px;line-height:1.65;margin-top:9px}
.hr{border-top:1px solid rgba(255,255,255,.08);margin:14px 0}
#trace{background:#080B10;border-radius:10px;padding:11px;font-family:ui-monospace,Menlo,monospace;
  font-size:11px;line-height:1.7;color:#7A8494;height:420px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
#trace .u{color:#fff}#trace .p{color:#4A5462}#trace .t{color:var(--brand)}
#trace .k{color:var(--ok)}#trace .r{color:var(--warn)}#trace .e{color:var(--dg)}
#trace .a{color:#C9D2E0}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.mini div{background:var(--el);border-radius:9px;padding:8px;text-align:center}
.mini span{display:block;font-size:10.5px;color:var(--t3)}
.mini b{font-size:18px;font-variant-numeric:tabular-nums}
.perm i{font-style:normal;padding:3px 9px;border-radius:6px;background:var(--el);font-size:11px;margin-right:6px}
.perm i.b{background:rgba(255,92,92,.14);color:var(--dg)}
.perm i.h{background:rgba(255,184,77,.14);color:var(--warn)}
.perm i.c{background:rgba(62,213,152,.14);color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>Demo Director</h1><span class="sub">座舱 Agent 模拟环境 v0.1</span>
  <span class="sp"></span>

<div class="wrap">
 <div>
  <section>
    <h2>模型 <span class="n" id="modelCount">—</span></h2>
    <div class="fld"><label>API Key</label><input id="key" type="password" placeholder="sk-or-v1-…"></div>
    <div class="fld"><label>模型</label><select id="model"></select></div>
    <div class="row">
      <button id="reload">刷新模型列表</button>
      <button id="fastOnly" class="on">只看快速模型</button>
    </div>
    <div class="note" id="modelNote">快速模型按名称启发式筛选（flash / mini / haiku / lite / turbo / small / nano）并按价格升序排列——价格低通常意味着模型小、首字快。关掉筛选可看全部支持 function calling 的模型。</div>
  </section>

  <section>
    <h2>对话</h2>
    <div class="row"><input id="say" placeholder="对主 Agent 说点什么，例如：把后排窗户开一半"><button class="pri" id="send">发送</button></div>
    <div class="note" id="busy"></div>
  </section>

  <section>
    <h2>全链路追踪 <span class="n" id="toolCount">—</span></h2>
    <div id="trace"></div>
    <div class="row" style="margin-top:9px"><button id="clr">清空</button><button id="resetSess">重置会话</button></div>
  </section>
 </div>

 <div>
  <section>
    <h2>车辆状态与场景</h2>
    <div class="g2">
      <button data-sc="park">静止 · 地库</button><button data-sc="highway">高速巡航 120</button>
      <button data-sc="rain">雨天市区</button><button data-sc="kids">带孩子 · 儿童锁</button>
    </div>
    <div class="hr"></div>
    <div class="fld"><label>当前城市</label><select id="city">
      <option value="116.397428,39.90923">北京</option>
      <option value="121.473701,31.230416">上海</option>
      <option value="104.065861,30.657401">成都</option>
      <option value="113.264385,23.129112">广州</option>
      <option value="114.057868,22.543099">深圳</option>
    </select></div>
    <div class="note">导航算的距离/时长以这个为起点——不选对，异地导航会出现"1786km"这种离谱数字，不是 Bug。</div>
    <div class="hr"></div>
    <div class="fld"><label>车速</label><input type="range" id="spd" min="0" max="140" value="0"><span class="v" id="spdV">0 km/h</span></div>
    <div class="fld"><label>车外温</label><input type="range" id="tmp" min="-10" max="40" value="3"><span class="v" id="tmpV">3 °C</span></div>
    <div class="fld"><label>电量</label><input type="range" id="soc" min="0" max="100" value="68"><span class="v" id="socV">68 %</span></div>
    <div class="fld"><label>说话人</label><select id="vsrc">
      <option value="driver">主驾</option><option value="passenger">副驾</option>
      <option value="rearLeft">左后</option><option value="rearRight">右后</option></select></div>
    <div class="g2"><button id="bLock">儿童锁 关</button><button id="bRain">天气 多云</button></div>
    <div class="mini">
      <div><span>主驾</span><b id="m-driver">0</b></div><div><span>副驾</span><b id="m-passenger">0</b></div>
      <div><span>左后</span><b id="m-rearLeft">0</b></div><div><span>右后</span><b id="m-rearRight">0</b></div>
    </div>
    <div class="note" id="invar"></div>
    <div class="perm" style="margin-top:12px">
      <i class="c">彩 可直接执行</i><i class="h">灰 需确认</i><i class="b">黑 AI 禁区</i>
    </div>
  </section>
 </div>
</div>

      title: "车灯",
      items: [
        { label: "大灯", value: cn2(store2.get("cabin.light.headlight.state")) },
        { label: "后备箱灯", value: cn2(store2.get("cabin.light.trunkLight.state")) }
      ]
    }),
    driveCard: ({ store: store2 }) => ({
      title: "驾驶设置",
      items: [
        { label: "驾驶模式", value: cn2(store2.get("vehicle.driveMode")) },
        { label: "动能回收", value: store2.get("vehicle.regenLevel"), unit: "级" },
        { label: "悬架", value: cn2(store2.get("vehicle.suspensionHeight")) }
      ]
    }),
    // 门/舱盖只显示开着的——全关时明确说"全部关好"
    openingCard: ({ store: store2 }) => {
      const defs = [
        ["cabin.door.driver.isOpen", "主驾车门"],
        ["cabin.door.passenger.isOpen", "副驾车门"],
        ["cabin.door.rearLeft.isOpen", "左后车门"],
        ["cabin.door.rearRight.isOpen", "右后车门"],
        ["cabin.trunk.isOpen", "后备箱"],
        ["cabin.chargePort.isOpen", "充电口"]
      ];
      const items = defs.filter(([p]) => store2.get(p) === true).map(([, label]) => ({ label, value: "开启" }));
      return { title: "门与舱盖", items: items.length ? items : [{ label: "车门/后备箱/充电口", value: "全部关好" }] };
    }
  };

  // agents/main-agent/manifest.ts
  var MAIN_AGENT = {
    id: "main-agent",
    name: "主Agent",
    version: "0.1.0",
    tools: ["*"],
    context: ["vehicleState", "capabilities", "speaker", "environment", "desktop"],
    maxRounds: 6,
    persona: `你是这台车的车载助手，能直接操作车辆功能。
说话像坐在副驾的朋友：简短、口语、不客套，一般不超过两句。这是**语音播报**，
不要用 Markdown、列表符号、表情；坐标经纬度这类数字别念出来，说地名就行。
用户在开车，**只能用说的跟你交互，不能点屏幕**，所以永远别说"点一下""你选一个点击"。
你就是这台车的助手，别提自己是什么模型、哪家公司做的。

行为准则：
1. 意图明确就直接调工具，别反问显而易见的事，**用户说过的别再问第二遍**；一次意图多个工具一起调。
2. 结合车辆状态与说话人位置判断：后排的人说"开窗"，指的是他自己那扇。
3. rejected → 用 message 说原因，把 suggestion 作为替代方案给出来。
4. unavailable → 坦白这台车做不到，绝不假装成功或编造结果。也别许做不到的诺——
   你只在用户开口时才醒着，没法"等会儿自动帮他"，该说"你降下来喊我一声"。
5. CONFIRM_REQUIRED → 用它的 message 问用户，同意后带 token 重调同一工具。
6. 只用工具列表里有的能力。但**说"做不到"之前先想想能不能组合**——"找个周围有饺子馆的
   充电站"分两步就成：先搜充电站拿坐标，再以那坐标搜饺子馆。同一工具换参数多调也是组合。
7. **安全红线**：刹车、转向、油门这类直接关系行车安全的操作永不介入。这是设计上定死的，
   不是"这次做不到"，也别拿"我够不着"搪塞——直说只能由驾驶员自己来，AI 不替他做。
8. 执行成功后简短确认，别复述参数。**屏幕上已经摆出来的也别逐条念**——多个候选、
   多条路线、多地天气都在卡片里，你只说关键差别和建议："最快那条要两块过路费，另外两条免费"。
9. 用户问你会做什么 → 调 capability.list（目录会上屏），口头概括一两句就行，**别凭记忆背清单**。
10. 卡片由系统按状态自动出：车控、导航、天气、能力目录、确认与选择，调完对应工具就会出现，
   **不需要你调 card.show**；只有系统没覆盖的临时内容才自己建卡。被挤掉时顺带告诉用户。`
  };

  // src/director/main.ts
  var import_meta = {};
  var $ = (id) => document.getElementById(id);
  var POS = ["driver", "passenger", "rearLeft", "rearRight"];
  var store = createStore(SIGNALS, CONSTRAINTS);
  var desk = createDesk();
  var amapWebKey = import_meta.env?.VITE_AMAP_WEB_KEY || "";
  var amap = amapWebKey ? createAmapClient(fetch.bind(window), { webKey: amapWebKey }) : void 0;
  if (!amapWebKey) console.warn("未配置 VITE_AMAP_WEB_KEY，navigation.*/weather.query 会报 unavailable");
  var registry = createRegistry(store, TOOLS, Date.now, { desk, amap });
  createOrchestrator({ store, desk, rules: CARD_RULES, builders: DATA_BUILDERS, deps: { store, amap } }).start();
  var apiKey = "";
  var modelId = "";
  var llm = createOpenRouter(() => apiKey, () => modelId);
  var agent = createAgent({
    manifest: MAIN_AGENT,
    registry,
    store,
    llm,
    desktopSummary: () => desk.summary(),
    onTurnStart: () => desk.endTask()
  });
  var brief = (c) => ({
    id: c.id,
    template: c.template,
    size: c.size,
    kind: c.kind,
    row: c.row,
    col: c.col,
    rowSpan: c.rowSpan,
    colSpan: c.colSpan,
    title: c.data?.title ?? CARD_TEMPLATES.find((t) => t.id === c.template)?.label ?? c.template,
    data: c.data
  });
  function pushDesk() {
    const l = desk.layout();
    bus.send({ type: "cards", desk: {
      cards: l.cards.map(brief),
      overlay: l.overlay ? brief(l.overlay) : void 0,
      free: l.free
    } });
  }
  desk.subscribe(pushDesk);
  setInterval(() => desk.tick(), 500);
  $("toolCount").textContent = `${registry.list(MAIN_AGENT.tools).length} tools`;
  var bus = createBus((m) => {
    if (m.type === "hello") setConn(true);
  });
  var setConn = (ok) => {
    $("dot").classList.toggle("on", ok);
    $("connTxt").textContent = ok ? "车机屏已连接" : "车机屏未连接";
  };
  $("openScreen").onclick = () => {
    const w = open(new URL("screen.html", location.href).href, "cockpitScreen", "width=1440,height=880");
    bus.setPeer(w);
    log("p", "已打开车机屏 · 拖到外接屏后按 F 全屏");
  };
  function push() {
    const target = {};
    for (const k of POS) target[k] = store.getTarget(`cabin.window.${k}.position`);
    bus.send({
      type: "state",
      target,
      meta: {
        speed: store.get("vehicle.speed"),
        childLock: store.get("cabin.childLock"),
        weather: store.get("env.weather"),
        outTemp: store.get("cabin.temperature.outside"),
        soc: store.get("powertrain.soc")
      }
    });
    for (const k of POS) $(`m-${k}`).textContent = String(Math.round(store.getTarget(`cabin.window.${k}.position`)));
    const v = store.checkInvariants();
    $("invar").innerHTML = v.length ? `<span style="color:#FF5C5C">⚠ 不变量违规：${v.join("；")}</span>` : "状态不变量：正常";
  }
  setInterval(() => {
    store.tick(200);
    push();
  }, 200);
  pushDesk();
  var traceEl = $("trace");
  function log(cls, text) {
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = text;
    traceEl.appendChild(div);
    traceEl.scrollTop = traceEl.scrollHeight;
  }
  $("clr").onclick = () => traceEl.innerHTML = "";
  $("resetSess").onclick = () => {
    agent.reset();
    log("p", "── 会话已重置 ──");
  };
  agent.on((e) => {
    switch (e.type) {
      case "thinking":
        bus.send({ type: "voice", s: "thinking", text: null });
        break;
      case "executing":
        bus.send({ type: "voice", s: "executing" });
        break;
      case "speaking":
        bus.send({ type: "voice", s: "speaking", text: e.text, who: "agent" });
        break;
      case "confirming":
        bus.send({ type: "voice", s: "confirming", text: e.text, who: "agent" });
        bus.send({ type: "card", action: "show", id: "confirm", title: "需要确认", body: e.text });
        break;
      case "rejected":
        bus.send({ type: "voice", s: "rejected" });
        bus.send({ type: "reject", on: true, title: "已拒绝执行", desc: e.text });
        break;
      case "done":
        setTimeout(() => bus.send({ type: "voice", s: "idle", text: "" }), 3e3);
        break;
      case "error":
        log("e", "✗ " + e.message);
        bus.send({ type: "voice", s: "rejected", text: "出错了：" + e.message, who: "agent" });
        break;
    }
  });
  var busy = false;
  async function ask(text) {
    if (busy) return;
    if (!apiKey) {
      log("e", "✗ 请先填入 OpenRouter API Key");
      return;
    }
    if (!modelId) {
      log("e", "✗ 请先选择模型");
      return;
    }
    busy = true;
    $("busy").textContent = "思考中…";
    bus.send({ type: "reject", on: false });
    bus.send({ type: "card", action: "dismiss", id: "confirm" });
    bus.send({ type: "voice", s: "listening", text, who: "user" });
    log("u", `
▸ ${text}`);
    const t0 = performance.now();
    const r = await agent.run(text);
    for (const s of r.trace) {
      if (s.type === "prompt") log("p", `  · 注入 ${s.system.length} 字符 / ${s.toolCount} 个工具`);
      if (s.type === "toolCall") log("t", `  → ${s.name}(${JSON.stringify(s.args)})  [${s.permission}]`);
      if (s.type === "toolResult") {
        const res = s.result;
        const cls = res.status === "ok" ? "k" : res.status === "inputRequired" ? "r" : res.status === "failed" ? "e" : "r";
        log(cls, `  ← ${res.status}${res.code ? " · " + res.code : ""}${res.message ? " · " + res.message : ""}  (${s.ms}ms)`);
        if (res.status === "ok" && res.changed?.length) {
          const ids = res.changed.filter((p) => p.startsWith("cabin.window.")).map((p) => p.split(".")[2]);
          if (ids.length) bus.send({ type: "highlight", ids });
          if (res.code === "SPEED_LIMITED") bus.send({ type: "reject", on: true, title: "已限位", desc: `${res.message} · <code>${res.code}</code>` });
          const cid = res.data?.cardId;
          if (cid) bus.send({ type: "highlight", ids: [], cards: [cid] });
        }
      }
    }
    log("a", `  ⟵ ${r.reply || "(无话术)"}`);
    log("p", `  ${r.rounds} 轮 · ${Math.round(performance.now() - t0)}ms · ${r.stopReason}`);
    push();
    busy = false;
    $("busy").textContent = "";
  }
  $("send").onclick = () => {
    const v = $("say").value.trim();
    if (v) {
      $("say").value = "";
      ask(v);
    }
  };
  $("say").onkeydown = (e) => {
    if (e.key === "Enter") $("send").click();
  };
  var setSpeed = (v) => {
    store.setDirect("vehicle.speed", v);
    $("spd").value = String(v);
    $("spdV").textContent = `${v} km/h`;
    push();
  };
  var setSrc = (v) => {
    store.setDirect("perception.voiceSource", v);
    $("vsrc").value = v;
  };
  var setLock = (v) => {
    store.setDirect("cabin.childLock", v);
    const b = $("bLock");
    b.textContent = "儿童锁 " + (v ? "开" : "关");
    b.classList.toggle("on", v);
    push();
  };
  var setRain = (v) => {
    store.setDirect("env.weather", v ? "rain" : "cloudy");
    const b = $("bRain");
    b.textContent = "天气 " + (v ? "小雨" : "多云");
    b.classList.toggle("on", v);
    push();
  };
  $("spd").oninput = (e) => setSpeed(Number(e.target.value));
  $("tmp").oninput = (e) => {
    const v = Number(e.target.value);
    store.setDirect("cabin.temperature.outside", v);
    $("tmpV").textContent = `${v} °C`;
    push();
  };
  $("soc").oninput = (e) => {
    const v = Number(e.target.value);
    store.setDirect("powertrain.soc", v);
    $("socV").textContent = `${v} %`;
    push();
  };
  $("vsrc").onchange = (e) => setSrc(e.target.value);
  $("bLock").onclick = () => setLock(!store.get("cabin.childLock"));
  $("bRain").onclick = () => setRain(store.get("env.weather") !== "rain");
  var CITY_KEY = "cockpit-sim:city";
  var citySelect = $("city");
  var setCity = (value, announce) => {
    citySelect.value = value;
    store.setDirect("vehicle.location", value);
    if (announce) log("p", `当前城市 → ${citySelect.selectedOptions[0].textContent}`);
  };
  citySelect.onchange = (e) => {
    const v = e.target.value;
    localStorage.setItem(CITY_KEY, v);
    setCity(v, true);
  };
  var savedCity = localStorage.getItem(CITY_KEY);
  if (savedCity) setCity(savedCity, false);
  var SCENES = {
    park: () => {
      setSpeed(0);
      setRain(false);
      setLock(false);
    },
    highway: () => {
      setSpeed(120);
      setRain(false);
      setLock(false);
    },
    rain: () => {
      setSpeed(45);
      setRain(true);
      setLock(false);
    },
    kids: () => {
      setSpeed(30);
      setRain(false);
      setLock(true);
    }
  };
  document.querySelectorAll("[data-sc]").forEach((b) => b.onclick = () => {
    SCENES[b.dataset.sc]();
    log("p", `场景切换 → ${b.textContent}`);
  });
  var allModels = [];
  var fastOnly = true;
  var DEFAULT_MODEL_ID = "minimax/minimax-m3";
  function renderModels() {
    const list = fastOnly ? pickFastModels(allModels) : allModels.slice().sort((a, b) => (a.promptPrice ?? 0) - (b.promptPrice ?? 0));
    const sel = $("model");
    sel.innerHTML = list.map((m) => `<option value="${m.id}">${m.name}${m.promptPrice ? `　·　$${(m.promptPrice * 1e6).toFixed(2)}/M` : ""}</option>`).join("");
    $("modelCount").textContent = `${list.length} / ${allModels.length}`;
    if (list.length) {
      modelId = list.find((m) => m.id === DEFAULT_MODEL_ID)?.id ?? list[0].id;
      sel.value = modelId;
    }
  }
  $("model").onchange = (e) => {
    modelId = e.target.value;
    log("p", `模型切换 → ${modelId}`);
  };
  $("fastOnly").onclick = () => {
    fastOnly = !fastOnly;
    $("fastOnly").classList.toggle("on", fastOnly);
    renderModels();
  };
  async function loadModels() {
    if (!apiKey) {
      allModels = FALLBACK_MODELS;
      renderModels();
      return;
    }
    try {
      allModels = await llm.models();
      log("k", `✓ 已加载 ${allModels.length} 个支持 function calling 的模型`);
    } catch (err) {
      allModels = FALLBACK_MODELS;
      log("e", `✗ 模型列表拉取失败，使用兜底列表：${err}`);
    }
    renderModels();
  }
  $("reload").onclick = loadModels;
  $("key").oninput = (e) => {
    apiKey = e.target.value.trim();
  };
  $("key").onchange = loadModels;
  if (apiKey) {
    $("key").value = apiKey;
  }
  loadModels();
  push();
  log("p", "控制面板就绪 · 先「打开车机屏」，选好模型后即可对话");
})();

</script>
</body>
</html>
