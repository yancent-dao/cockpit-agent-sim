# 零运行时依赖 + 单命令全绿，CI 便宜到没理由不配。
# pilot 跑批消耗真实 API 额度，刻意不进 CI —— 跟它不进 npm test 同一个理由。
name: test
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
