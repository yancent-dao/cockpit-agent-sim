<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>座舱模拟环境 · 车机屏</title>
<style>
:root{
  /* 日间配色：v0.1 单一浅色主题，不做日夜切换 */
  --bg-base:#EEF1F6;--bg-surface:#FFFFFF;--bg-elevated:#E4E9F0;
  --text-primary:#1B2430;--text-secondary:#5C6675;
  --brand:#1E6FD9;--success:#1B9E68;--warning:#C97A16;--danger:#DB4045;
  --hairline:rgba(20,30,45,.09);--track:#E1E6ED;
  --r-sm:12px;--r-md:20px;--r-lg:32px;--ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#14171C;overflow:hidden;   /* 触控落地（2026-08-12）：cursor 回归，屏幕可点选 */
  /* 全局字体（Avatar 定稿 §04）：MiSans 优先零打包，没装就回退系统中文黑体。
     单一事实来源在 src/design/tokens.ts 的 FONT_STACK——这里是静态壳，改要一起改 */
  font-family:"MiSans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--text-primary);-webkit-font-smoothing:antialiased}
/* 真机外壳（风格稿）：细黑边悬浮屏 + 天际线背景——上半是舱外天空，
   下半是仪表台深色，屏幕浮在分界线上 */
#vp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#8B93D8 0%,#A9AEE3 30%,#C6C9EF 52%,
    #1a1d2e 52.3%,#12141f 78%,#0c0d15 100%)}
#stage{width:2560px;height:1440px;flex:none;transform-origin:center;
  position:relative;overflow:hidden;border-radius:72px;
  /* 梦幻天空壁纸：薰衣草蓝渐变 + 云团光斑（纯 CSS，零外链） */
  background:
    radial-gradient(52% 62% at 82% 78%, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 60%),
    radial-gradient(38% 44% at 68% 30%, rgba(122,132,235,.35) 0%, rgba(122,132,235,0) 65%),
    radial-gradient(45% 50% at 22% 88%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(158deg,#B9BEF0 0%,#C9CDF4 26%,#DCDEF8 52%,#EFEDFB 78%,#F7F4FC 100%);
  box-shadow:0 0 0 16px #0a0b0f, 0 42px 110px -12px rgba(10,12,30,.65), 0 10px 30px rgba(10,12,30,.45)}
/* 玻璃斜光 */
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:9;
  background:linear-gradient(115deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.04) 14%, transparent 30%);
  border-radius:inherit}

#statusbar{height:96px;padding:0 60px;display:flex;align-items:center;gap:32px;
  font-size:26px;color:var(--tx-2);position:relative;z-index:2}
#statusbar .clock{font-size:36px;color:var(--text-primary);font-weight:500}
#statusbar .sp{flex:1}#statusbar b{color:var(--text-primary);font-weight:500}
.chip{padding:8px 22px;border-radius:999px;font-size:24px;transition:.24s var(--ease);
  background:rgba(255,255,255,.42);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.55)}
/* 顶部语音提示胶囊（风格稿）：能力曝光的另一半 */
.hintpill{display:flex;align-items:center;gap:12px;padding:10px 26px;border-radius:999px;
  background:rgba(255,255,255,.5);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.6);
  color:var(--tx-2);font-size:24px}
.hintpill b{color:var(--brand-fg);font-weight:600}
.chip.warn{background:rgba(201,122,22,.16);color:var(--warning)}
/* 后台任务芯片：持续状态的第四类显示面（§6.1）。转圈=在跑，点开出任务列表卡 */
#chipTask{cursor:pointer;max-width:520px}
#taskCur{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:inline-block;max-width:360px;vertical-align:bottom;margin-left:6px}
#chipTask .spin{display:inline-block;font-style:normal;animation:taskspin 1.6s linear infinite}
@keyframes taskspin{to{transform:rotate(360deg)}}

/* 桌面高度锚死在 300（像素契约：996 从这来，231/486/741/996 一个都不能动）。
   语音带退场（2026-08-18 角落蒙层定稿）后底部这条留白归横幅与呼吸感——
   曾想让桌面长高占掉它，那会把全套档位像素、形态阈值、画廊校准一起掀翻 */
#stage{--deskBottom:300px}
#desk{position:absolute;top:var(--status-h,96px);left:0;right:0;bottom:var(--deskBottom);
  padding:var(--desk-pad,24px 60px);
  display:grid;grid-template-columns:repeat(var(--grid-cols,12),1fr);
  grid-template-rows:repeat(var(--grid-rows,4),1fr);gap:var(--desk-gap,24px);
  transition:bottom .32s var(--ease)}
.zoneTag{position:absolute;left:14px;top:50%;transform:translateY(-50%) rotate(180deg);
  writing-mode:vertical-rl;font-size:18px;color:#D7DCE3;letter-spacing:6px}
/* ══════════ 卡片基座 ══════════
   字号一律 = 字阶 × --u。--u 由档位类（.t-box / .t-stage …）给，
   一个类管住整张卡的排版比例 —— 取代了原来 22 条 .sz-* 硬怼 60 处 font-size。
   加一个档位只需在 tokens.ts 的 TIER_UNITS 里加一行，这里一行不动。 */
/* 玻璃层变量化（2026-08-18 主题解禁）：夜间只换这几个值，玻璃质感不变 */
:root{--glass-bd:rgba(255,255,255,.62);--glass-bg:rgba(255,255,255,.58);
  --glass-gloss:rgba(255,255,255,.8);--glass-shadow:rgba(60,68,140,.35)}
body[data-night]{--glass-bd:rgba(255,255,255,.12);--glass-bg:rgba(19,26,37,.72);
  --glass-gloss:rgba(255,255,255,.06);--glass-shadow:rgba(0,0,0,.5);
  --bg-base:#0B0F16;--bg-surface:#131A25;--bg-elevated:#1B2432}
.card{position:relative;border:1px solid var(--glass-bd);
  background:var(--glass-bg);
  backdrop-filter:blur(30px) saturate(1.25);-webkit-backdrop-filter:blur(30px) saturate(1.25);
  border-radius:var(--r-l);box-shadow:0 18px 50px -18px var(--glass-shadow),inset 0 1px 0 var(--glass-gloss);overflow:hidden;
  padding:calc(22px*var(--u)) calc(26px*var(--u));display:flex;flex-direction:column;
  transition:box-shadow .24s var(--ez,var(--ease)),background .24s var(--ez,var(--ease));
  animation:cardIn var(--d3,.32s) var(--ez,var(--ease))}
/* 语义身份靠序号圆点、进度轨、标题色表达就够了。
   右上角那团色晕试过，产品判定是噪音——远看像卡片没渲染完 */
/* 进场：从下方抬起并放大到位。车机 HMI 一律 ≤400ms */
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
/* 退场：先缩再淡。节点等动画结束才移除——直接 remove 的话卡片是"啪"地不见的 */
.card.leaving{animation:cardOut var(--d2,.22s) var(--ez-in,ease-in) forwards;pointer-events:none}
@keyframes cardOut{to{opacity:0;transform:scale(.94)}}
/* 右上角控制簇（2026-08-13 实拍反馈）：缩放/关闭，跟模板无关的通用桌面管理动作。
   绝对定位在 .card 的 padding 盒内（.card 本身 overflow:hidden，负偏移会被裁掉）*/
.cardctl{position:absolute;top:calc(16px*var(--u));right:calc(18px*var(--u));z-index:3;
  display:flex;align-items:center;gap:calc(6px*var(--u))}
.cardctl .cbtn{width:calc(26px*var(--u));height:calc(26px*var(--u));border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex:none;
  font-size:calc(16px*var(--u));line-height:1;color:var(--tx-2,#5b6472);
  background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.06);cursor:pointer;user-select:none}
.cardctl .cbtn.off{opacity:.25;pointer-events:none}
.cardctl .cbtn.cclose{color:#b4483f}
/* chip/strip/bar 太小放不下三个圆点，缩/关按钮先收起——但放大按钮必须留着，
   不然缩到这三档就成了单行道，用户再也点不回大尺寸（实拍反馈：缩到最小后没有放大按钮了） */
.t-chip .cardctl .cbtn:not([data-act="tap:grow"]),
.t-strip .cardctl .cbtn:not([data-act="tap:grow"]),
.t-bar .cardctl .cbtn:not([data-act="tap:grow"]){display:none}
/* 等位区方向动画（2026-08-13）：下台=滑向右缘（去了"界面之外"），
   上台=从右缘滑入。跟普通进退场分开——用户能读出"收起来了"vs"没了" */
.card.tostage{animation:toStage var(--d2,.26s) var(--ez-in,ease-in) forwards;pointer-events:none}
@keyframes toStage{to{opacity:0;transform:translateX(90px) scale(.9)}}
.card.fromstage{animation:fromStage var(--d3,.32s) var(--ez,var(--ease))}
@keyframes fromStage{from{opacity:0;transform:translateX(90px) scale(.95)}to{opacity:1;transform:none}}
/* 右缘边缘条："界面之外还有内容"的最小视觉隐喻。不占栅格，贴桌面右缘垂直居中 */
#stagedTab{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:5;
  display:none;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  padding:22px 10px 22px 14px;border-radius:22px 0 0 22px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(14px);
  border:1px solid rgba(0,0,0,.06);border-right:none;box-shadow:var(--sh-1,0 4px 16px rgba(0,0,0,.08));
  color:var(--tx-2,#5b6472);font-size:26px;font-weight:600;letter-spacing:.05em}
#stagedTab.on{display:flex}
#stagedTab .dots{letter-spacing:2px;line-height:.6;writing-mode:vertical-rl}
#stagedTab b{font-size:30px;color:var(--tx-1,#1c2430)}
/* 错峰 45ms 由 JS 按「这一批第几张新卡」设 style.animationDelay。
   用 nth-child 不行：节点复用时 append 顺序不等于视觉顺序 */
.card.hot{box-shadow:0 0 0 3px var(--ac,var(--brand)),var(--sh-2)}
.card>h3{flex:none;display:flex;align-items:center;gap:calc(12px*var(--u));
  margin-bottom:calc(12px*var(--u));font-size:calc(var(--t-title)*var(--u));
  font-weight:500;color:var(--tx-2,var(--text-secondary));letter-spacing:.06em}
/* 40px 身份图标块：语义色底 + 描边 + 线性图标，远看一眼定位卡片类型 */
.card>h3 .ico{flex:none;width:calc(40px*var(--u));height:calc(40px*var(--u));
  border-radius:calc(12px*var(--u));background:var(--acbg);border:1px solid var(--acbd);
  color:var(--ac);display:flex;align-items:center;justify-content:center}
.card>h3 .ico svg{width:58%;height:58%}
.card>h3 .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 单行档图标块跟着缩，不然它一个就占掉半张卡 */
.t-chip>h3 .ico,.t-strip>h3 .ico{width:calc(30px*var(--u));height:calc(30px*var(--u));border-radius:calc(9px*var(--u))}
/* 诊断 1：内容缩在左上角，下半张脸空着。
   .bd 认领全部剩余高度，主数值贴底 —— 空白被推到标题与数据之间，而不是堆在底部。 */
.bd{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;
  gap:calc(8px*var(--u));overflow-y:auto;overscroll-behavior:contain}
/* 可点目标的按压反馈。车规命中目标 ≥96px（stage 像素） */
[data-act]{cursor:pointer;transition:transform .12s var(--ez,ease),opacity .12s}
[data-act]:active{transform:scale(.94);opacity:.75}
/* 主控（重设计 v2）：三键去底色纯图标，只有一个深色主键（实屏 75px 指尖标准）。
   pskip 是播客的 ±15s/+30s 文字键。命中区靠 padding 保 ≥72px */
.plctl{display:flex;align-items:center;justify-content:center;gap:calc(34px*var(--u))}
.plctl .pside,.plctl .pskip{min-width:calc(72px*var(--u));height:calc(64px*var(--u));
  display:flex;align-items:center;justify-content:center;color:var(--tx-2)}
.plctl .pside svg{width:calc(28px*var(--u));height:calc(28px*var(--u))}
.plctl .pskip{font-size:calc(var(--t-cap)*var(--u)*.92);font-variant-numeric:tabular-nums}
.plctl .pmain{width:calc(75px*var(--u));height:calc(75px*var(--u));border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--plac,#111C30);color:#fff;
  box-shadow:0 8px 22px -8px var(--plac,#111C30)}
.plctl .pmain svg{width:calc(30px*var(--u));height:calc(30px*var(--u))}
/* 「贴底」只对**主数值**成立。列表、能力目录、块阵这类多条目内容必须自己认领
   全部高度从上往下排 —— 否则它们被整块推到底，上半张脸照样空着，
   只是把「缩在左上角」换成了「缩在左下角」 */
.bd>.listcard,.bd>.cap,.bd>.blocks,.bd>.glist{flex:1;min-height:0}
/* 卡里只有一块主数值时（card 档的天气、续航），让它居中占满并放大一阶 ——
   一个 76px 的数字挂在 562px 高的卡底部，看着像没加载完 */
.bd>.wxnow:only-child{flex:1;align-items:center}
.bd>.wxnow:only-child b{font-size:calc(var(--t-mega)*var(--u))}

/* ── 待选态：整卡描边呼吸 ──
   用户是用语音选的（"第二个"），屏上必须让他知道**现在轮到他说话了**。
   描边而不是底色：底色会跟语义色晕打架 */
.card.picking{box-shadow:0 0 0 3px var(--ac),var(--sh-1);animation:breathe 2.2s var(--ez,ease-in-out) infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 3px var(--ac),var(--sh-1)}
  50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 35%,transparent),var(--sh-2)}}
/* 倒计时：voice.ask 有超时时底部走条。数字倒数会让人紧张，走条只让人知道"要抓紧" */
.card .cd{position:absolute;left:0;bottom:0;height:5px;background:var(--acgr);
  animation:cdrun linear forwards}
@keyframes cdrun{from{width:100%}to{width:0}}
/* critical 走覆盖层：安全告警必须盖住一切，缩在角落等于没显示 */
/* 覆盖层：full 档内容卡 + 放不下的 critical 告警。跟桌面区同一块地方 */
#overlay{position:absolute;top:96px;left:0;right:0;bottom:var(--deskBottom,300px);padding:24px 60px;
  display:none;z-index:6;transition:bottom .32s var(--ez,var(--ease))}
#overlay.on{display:block;animation:cardIn var(--d3,.34s) var(--ez,var(--ease))}
#overlay .card{height:100%}
/* alert 态：安全告警要一眼看出跟「一张全屏能力目录」不是一回事 */
#overlay.alert .card{border:3px solid var(--danger-bd);box-shadow:0 0 0 6px rgba(239,68,68,.12),var(--sh-2)}
#overlay.alert .card>h3{color:var(--danger-fg)}
/* 全屏了就该用全屏的字号。照卡片档位渲染的话，一条占满 2560×1044 的安全告警
   正文只有 55px —— 开着车扫一眼根本读不到 */
#overlay .card .sub{font-size:calc(var(--t-hero)*var(--u)*.72);line-height:1.25;
  color:var(--tx-1,var(--text-primary))}
#overlay .card .sug{font-size:calc(var(--t-lead)*var(--u)*.8)}

/* ── 生成式卡流光边框两态 ──
   进场/生成中 conic 渐变旋转 2 秒（"这是刚生成的"），之后静置为渐变描边
   （"这是生成的"）。持续流动在驾驶环境是注意力噪音——
   "有事发生才动"沿用待选卡呼吸描边的先例 */
@property --genang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.tpl-canvas.fresh, .tpl-canvas-app.fresh {
  border: 3px solid transparent;
  background: linear-gradient(var(--sf-card,#fff), var(--sf-card,#fff)) padding-box,
    conic-gradient(from var(--genang), var(--media-fg), var(--pick-fg), var(--brand-fg), var(--media-fg)) border-box;
  animation: genspin 1.4s linear infinite;
}
@keyframes genspin { to { --genang: 360deg } }
.tpl-canvas-app{border:2px solid var(--acbd)}
.cvframe{width:100%;height:100%;border:0;display:block;background:transparent}

/* ── 生成式卡：紫色描边 + 角标 ──
   角标是**诚实标注**：这张卡是临场生成的，跟固定模板不是一回事，
   用户有权知道自己在看的东西每次可能不一样 */
.tpl-canvas{border:2px solid var(--acbd)}
.genmark{margin-left:auto;font-size:calc(var(--t-cap)*var(--u)*.86);font-weight:500;
  padding:calc(3px*var(--u)) calc(11px*var(--u));border-radius:var(--r-pill,999px);
  background:var(--acbg);border:1px solid var(--acbd);color:var(--ac);letter-spacing:0}
.cvhost{flex:1;min-height:0;overflow:hidden}
/* 严重溢出时开滚动：**能滚就别丢**。以前这一档直接剥成纯文字，
   实拍那份研究报告因此被砍成半份。滚动保住每一个字。
   行驶中不给（判据在 overflowgate 的纯函数里），所以这个类不会被加上。 */
.cvscroll .cvhost{overflow-y:auto;overscroll-behavior:contain;
  /* 底部渐隐：**看不见的能力等于没有能力** —— 不给个信号用户不知道下面还有 */
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 42px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 42px),transparent)}
/* 滚到底就把渐隐和提示一起撤掉，不然最后一行永远是灰的、
   提示也一直在催一个已经做完的动作（.cvend 由滚动事件挂） */
.cvscroll.cvend .cvhost{-webkit-mask-image:none;mask-image:none}
.cvscroll.cvend::after{opacity:0}
.cvscroll::after{transition:opacity .2s var(--ez,var(--ease))}
.cvscroll .cvhost::-webkit-scrollbar{width:calc(6px*var(--u,1))}
.cvscroll .cvhost::-webkit-scrollbar-thumb{background:var(--n4,#CBD5E1);border-radius:999px}
.cvscroll::after{content:'⌄ 可上下滑动';position:absolute;right:calc(18px*var(--u,1));
  bottom:calc(10px*var(--u,1));font-size:calc(var(--t-cap)*var(--u,1)*.8);
  color:var(--tx-3);pointer-events:none;letter-spacing:.04em}

/* ── 语义身份：八类各四件套 ──
   诊断 5：系统卡描边、提示底色、拒绝横幅全是 warning 橙，用户分不出三者。
   身份由「模板 + 紧急度」定，不由 kind 定 —— kind 是编排优先级，不是外观。 */
.a-brand {--ac:var(--brand-fg); --acbg:var(--brand-bg); --acbd:var(--brand-bd); --acgr:var(--brand-gr)}
.a-info  {--ac:var(--info-fg);  --acbg:var(--info-bg);  --acbd:var(--info-bd);  --acgr:var(--info-gr)}
.a-ok    {--ac:var(--ok-fg);    --acbg:var(--ok-bg);    --acbd:var(--ok-bd);    --acgr:var(--ok-gr)}
.a-warn  {--ac:var(--warn-fg);  --acbg:var(--warn-bg);  --acbd:var(--warn-bd);  --acgr:var(--warn-gr)}
.a-danger{--ac:var(--danger-fg);--acbg:var(--danger-bg);--acbd:var(--danger-bd);--acgr:var(--danger-gr)}
.a-media {--ac:var(--media-fg); --acbg:var(--media-bg); --acbd:var(--media-bd); --acgr:var(--media-gr)}
.a-pick  {--ac:var(--pick-fg);  --acbg:var(--pick-bg);  --acbd:var(--pick-bd);  --acgr:var(--pick-gr)}
.a-sys   {--ac:var(--sys-fg);   --acbg:var(--sys-bg);   --acbd:var(--sys-bd);   --acgr:var(--sys-gr)}

/* ── 数值 ── */
.num{font-size:calc(var(--t-num)*var(--u));font-weight:600;color:var(--tx-1,var(--text-primary));
  font-variant-numeric:tabular-nums;letter-spacing:-1.5px;line-height:1;
  display:flex;align-items:flex-end;gap:calc(5px*var(--u))}
.num i{font-style:normal;font-size:.44em;font-weight:400;color:var(--tx-3,var(--text-secondary));
  letter-spacing:0;transform:translateY(-.08em)}

/* ── 块状均分 ──
   grid-auto-rows:1fr 让块平分剩余高度：三块一人三分之一，四块一人四分之一。
   数据条数变了高度自动重分，不用为每种条数写一条 CSS。 */
.blocks{flex:1;min-height:0;display:grid;gap:calc(10px*var(--u));grid-auto-rows:1fr}
.blocks.c2{grid-template-columns:1fr 1fr}
.blocks.c3{grid-template-columns:repeat(3,1fr)}
.blk{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);
  border-radius:calc(16px*var(--u));padding:calc(12px*var(--u)) calc(15px*var(--u));
  display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden;
  transition:box-shadow .24s var(--ez,var(--ease))}
.blk.hot{box-shadow:0 0 0 2px var(--ac)}
.blk.hot .num{color:var(--ac)}
.blk .lb{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-3,var(--text-secondary));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 布尔值 → 状态胶囊（"开"不配占一整块大黑字） */
.blk .pillv{align-self:flex-start;padding:calc(6px*var(--u)) calc(16px*var(--u));
  border-radius:var(--r-pill,999px);font-size:calc(var(--t-cap)*var(--u));font-weight:600;
  background:var(--n2,#EEF2F7);color:var(--tx-3,var(--text-secondary))}
.blk .pillv.on{background:var(--acgr);color:#fff;box-shadow:0 4px 12px -4px var(--ac)}
/* 枚举/文本值 → 降一级排版，不跟数值抢主角 */
.blk .txtv{font-size:calc(var(--t-lead)*var(--u)*.82);font-weight:600;color:var(--tx-1,var(--text-primary));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 7px 细轨。目标位刻度是过渡仿真已有能力的可视化——车窗正在开到 60% 时看得见终点 */
.trk{position:relative;height:calc(7px*var(--u));border-radius:99px;
  background:var(--n3,var(--bg-elevated));overflow:visible}
.trk .fl{height:100%;border-radius:99px;background:var(--acgr);
  transition:width var(--d4,.38s) var(--ez,var(--ease))}
.trk .tg{position:absolute;top:-3px;width:2.5px;height:calc(13px*var(--u));border-radius:2px;
  background:var(--ac);opacity:.42}

/* ── 文本块 ── */
.card .sub{font-size:calc(var(--t-body)*var(--u));color:var(--tx-2,var(--text-secondary));line-height:1.5}
.card .sug{margin-top:calc(10px*var(--u));font-size:calc(var(--t-cap)*var(--u));color:var(--ac)}
.card .opt{display:inline-block;padding:calc(8px*var(--u)) calc(20px*var(--u));font-weight:600;
  margin:calc(8px*var(--u)) calc(10px*var(--u)) 0 0;border-radius:var(--r-pill,999px);
  background:var(--acbg);border:1px solid var(--acbd);color:var(--ac);
  font-size:calc(var(--t-cap)*var(--u));font-weight:500}

/* ── 候选列表：序号让语音选择（"第一个"）和屏幕对得上号 ── */
.listcard{list-style:none;counter-reset:pick;margin:0;padding:0;
  display:grid;gap:calc(7px*var(--u));align-content:start;grid-auto-rows:max-content}
/* 触控后卡内可滚（.bd overflow:auto），但截断与"还有 N 条"保留——
   滚动位置模型看不见，模型的世界观仍以 summary 的可见条数为准 */
.listcard.c2{grid-template-columns:1fr 1fr;column-gap:calc(24px*var(--u))}
.listcard.c3{grid-template-columns:repeat(3,1fr);column-gap:calc(20px*var(--u))}
.listcard li{counter-increment:pick;display:flex;align-items:baseline;gap:calc(14px*var(--u));
  padding:calc(10px*var(--u)) calc(12px*var(--u));border-radius:calc(14px*var(--u));min-width:0;
  background:transparent;transition:background .15s}
.listcard li:nth-child(odd){background:color-mix(in srgb, var(--n1,#F6F8FB) 65%, transparent)}
.listcard li::before{content:counter(pick);flex:none;
  width:calc(38px*var(--u));height:calc(38px*var(--u));border-radius:calc(12px*var(--u));
  background:var(--acgr);color:#fff;box-shadow:0 2px 8px -2px var(--ac);
  font-size:calc(var(--t-cap)*var(--u));font-weight:700;
  display:flex;align-items:center;justify-content:center;align-self:center}
.listcard li b{font-size:calc(var(--t-body)*var(--u));font-weight:600;
  color:var(--tx-1,var(--text-primary));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listcard li small{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-3,var(--text-secondary));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listcard li .rr{margin-left:auto;font-style:normal;flex:none;
  font-size:calc(var(--t-cap)*var(--u));color:var(--ac);font-variant-numeric:tabular-nums}
/* 截断必须说出来。只截不说，用户以为屏上就这么多 */
.card .more{flex:none;margin-top:calc(6px*var(--u));font-size:calc(var(--t-cap)*var(--u));
  color:var(--tx-3,var(--text-secondary))}
/* 放不下一条时只报数量 —— 硬塞等于骗用户"屏上有" */
.card .lstcount,.capcount{flex:1;display:flex;align-items:center;justify-content:center;
  gap:calc(10px*var(--u))}
.card .lstcount b,.capcount b{font-size:calc(var(--t-hero)*var(--u));font-weight:700;line-height:1;
  color:var(--tx-1,var(--text-primary));font-variant-numeric:tabular-nums}
.card .lstcount span,.capcount span{font-size:calc(var(--t-cap)*var(--u));
  color:var(--tx-3,var(--text-secondary))}
.card .vehslot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
/* generic 的 items/actions：不是并列数值，用横排定义列而不是块 */
.card .glist{display:flex;flex-direction:column;gap:calc(4px*var(--u))}
.card .gi{display:flex;align-items:baseline;justify-content:space-between;
  gap:calc(14px*var(--u));padding:calc(7px*var(--u)) 0;
  border-bottom:1px solid var(--hair,var(--hairline))}
.card .gi:last-child{border-bottom:none}
.card .gi span{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-3,var(--text-secondary))}
.card .gi b{font-size:calc(var(--t-body)*var(--u));font-weight:600;
  color:var(--tx-1,var(--text-primary));font-variant-numeric:tabular-nums}
.card .gi b i{font-size:.72em;font-weight:500;font-style:normal;margin-left:3px;
  color:var(--tx-3,var(--text-secondary))}
.card .gacts{display:flex;flex-wrap:wrap}

/* ── 天气卡 ── */
.wxnow{flex:none;display:flex;align-items:flex-end;gap:calc(16px*var(--u))}
.wxnow b{font-size:calc(var(--t-hero)*var(--u));font-weight:600;line-height:.92;
  color:var(--tx-1,var(--text-primary));font-variant-numeric:tabular-nums;letter-spacing:-2px}
.wxnow b i{font-style:normal;font-size:.42em;font-weight:400;color:var(--tx-3,var(--text-secondary))}
.wxmeta{display:flex;flex-direction:column;gap:calc(3px*var(--u));padding-bottom:calc(6px*var(--u))}
.wxmeta span{font-size:calc(var(--t-body)*var(--u));color:var(--tx-2,var(--text-secondary))}
.wxmeta small{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-3,var(--text-secondary))}
/* 现象图标压住右侧留白——1/6 档"一个数字挂着"的空旷感就是它治的 */
.wxico{margin-left:auto;width:calc(120px*var(--u));height:calc(120px*var(--u));
  color:var(--ac);opacity:.85;align-self:center}
.wxico svg{width:100%;height:100%;stroke-width:1.4}
.t-chip .wxico,.t-strip .wxico{width:calc(52px*var(--u));height:calc(52px*var(--u))}

/* ── 导航：车道指引 + 下一步预告（2026-08-14） ── */
/* 路口最关键的信息是"在哪条道"。Android for Cars 把 Lane 列为一等组件 */
.lanebar{display:flex;justify-content:center;gap:calc(18px*var(--u));flex:none;
  padding:calc(8px*var(--u)) 0;font-size:calc(var(--t-lead)*var(--u));color:var(--n4,#CBD5E1)}
.lanebar i{font-style:normal}
.lanebar i.use{color:var(--ac)}
.navthen{flex:none;font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2);text-align:right}

/* ── 天气：今日温差 + 逐时降水条 ── */
.wxrng{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2);margin-left:calc(10px*var(--u))}
/* 柱高=气温，蓝柱=这个钟点会下雨。"接下来会不会下雨"是车里最想知道的 */
.hourly{display:flex;align-items:stretch;gap:calc(6px*var(--u));flex:1;min-height:calc(64px*var(--u));
  margin-top:calc(10px*var(--u))}
/* 一根柱 = 度数 + 柱体 + 钟点。柱高按当日温差归一化（hourlyView），
   绝对温度映射那版三根柱差 0.5% 肉眼看不出 —— 柱子必须携带信息 */
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:calc(3px*var(--u));min-width:0}
.hcol b{font-size:calc(var(--t-cap)*var(--u)*.86);font-weight:600;color:var(--tx-2)}
.hcol i{width:62%;background:var(--n3,#E2E8F0);border-radius:calc(4px*var(--u));font-style:normal}
.hcol span{font-size:calc(var(--t-cap)*var(--u)*.78);color:var(--tx-3);white-space:nowrap}
.hcol.wet i{background:var(--brand-fg,#1D4ED8)}
.hcol.wet b{color:var(--brand-fg,#1D4ED8)}
.fc{margin-top:calc(10px*var(--u))}

/* ── 播放器（重设计 v2）：顶行元信息带 / 辅助内容 / 次控排 / 队列 ── */
.plhead{display:flex;align-items:center;gap:calc(14px*var(--u));min-height:calc(40px*var(--u))}
.plbadge{font-size:calc(var(--t-cap)*var(--u)*.82);font-weight:600;color:#fff;
  padding:calc(3px*var(--u)) calc(16px*var(--u));border-radius:999px;letter-spacing:.5px}
.pltags i{font-style:normal;font-size:calc(var(--t-cap)*var(--u)*.78);color:var(--tx-3);
  border:1px solid var(--hairline);border-radius:calc(5px*var(--u));
  padding:calc(1px*var(--u)) calc(8px*var(--u));margin-right:calc(8px*var(--u))}
.pltags .livetag{color:#C0392B;border-color:rgba(192,57,43,.4)}
.plsp{flex:1}
.plpos{font-size:calc(var(--t-cap)*var(--u)*.82);color:var(--tx-3);font-variant-numeric:tabular-nums}
.plaux{min-height:calc(30px*var(--u))}
.plly{font-size:calc(var(--t-cap)*var(--u));line-height:1.7;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plly.cur{color:var(--tx-1);font-weight:500}
.plly.nxt{color:var(--tx-3);opacity:.8}
.pleq{display:inline-flex;gap:calc(4px*var(--u));align-items:flex-end;height:calc(30px*var(--u))}
.pleq i{width:calc(5px*var(--u));border-radius:3px;background:var(--plac,#C05A14);
  height:40%;animation:pleq .9s ease-in-out infinite}
.pleq i:nth-child(2){height:90%;animation-delay:.15s}.pleq i:nth-child(3){height:60%;animation-delay:.3s}
.pleq i:nth-child(4){height:80%;animation-delay:.45s}.pleq i:nth-child(5){height:50%;animation-delay:.6s}
@keyframes pleq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.plrow{display:flex;align-items:center;margin-top:calc(10px*var(--u))}
.plxtra{display:flex;align-items:center;gap:calc(20px*var(--u));width:calc(200px*var(--u))}
.plxtra.plxr{justify-content:flex-end}
.plxtra .pxi{display:inline-flex;color:var(--tx-3)}
.plxtra .pxi svg{width:calc(24px*var(--u));height:calc(24px*var(--u))}
.plxtra .pxi.on{color:var(--plac,var(--brand-fg))}
.plxtra .pfav{color:#C74B5F}
.pspeed{font-size:calc(var(--t-cap)*var(--u)*.9);font-weight:700;color:var(--plac);
  border:1px solid var(--hairline);border-radius:999px;padding:calc(2px*var(--u)) calc(12px*var(--u))}
.pvol .pltrk{width:calc(96px*var(--u));height:calc(5px*var(--u))}
.plctl:has(+ .plxtra){flex:1}
.plrow .plctl{flex:1}
.plqueue{margin-top:calc(10px*var(--u));border-top:1px solid var(--hairline);
  padding-top:calc(8px*var(--u));display:flex;flex-direction:column;gap:calc(2px*var(--u));
  overflow:hidden;min-height:0}
.plqueue .qi{display:flex;align-items:center;gap:calc(12px*var(--u));
  font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2);padding:calc(4px*var(--u)) 0;
  overflow:hidden;white-space:nowrap}
.plqueue .qi em{font-style:normal;width:calc(24px*var(--u));color:var(--tx-3);flex:none;
  font-variant-numeric:tabular-nums}
.plqueue .qi b{font-weight:500;overflow:hidden;text-overflow:ellipsis;min-width:0}
.plqueue .qi small{color:var(--tx-3);flex:none}
.plqueue .qi.now,.plqueue .qi.now em{color:var(--plac,var(--brand-fg))}

/* ── 最小档不要标题行（2026-08-14 设计纪律） ── */
/* 一行灰色标题吃掉三分之一高度还说不出什么。chip 只有 335×187 的画布，
   身份交给左上角的图标块承担，正文才是主角。
   不这么做的话指标卡的大数字（--t-hero 76px）直接撑破卡片（实测溢出 13px）。 */
.t-chip>h3 .ttl{display:none}
.t-chip>h3{margin-bottom:calc(4px*var(--u))}
.t-chip .mtv b{font-size:calc(var(--t-lead)*var(--u));line-height:1}
/* chip 只有 335×187 的画布，一个数字居中就够。撑到 --t-num 时字体的
   下伸部会把盒子顶出 6px（画廊页量到的），而卡片不可滚动 */
.t-chip .mtw{justify-content:center;gap:0}
.t-chip .mtv{align-items:center}

/* ── 新增六张（2026-08-14） ── */
/* 轮播：横向图卡流。页码是屏内状态 */
.cw{display:grid;gap:calc(14px*var(--u));flex:1;min-height:0}
.ci{display:flex;flex-direction:column;gap:calc(6px*var(--u));cursor:pointer;min-height:0}
.ci .cim{flex:1;min-height:calc(60px*var(--u));border-radius:calc(12px*var(--u));
  background:linear-gradient(150deg,#DDD6FE,#A5B4FC);background-size:cover;background-position:center}
.ci span{font-size:calc(var(--t-body)*var(--u));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci small{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2)}
.cpage{display:flex;justify-content:flex-end;align-items:center;gap:calc(14px*var(--u));
  font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2);margin-top:calc(8px*var(--u))}
.cpage b{color:var(--ac);cursor:pointer;font-size:calc(var(--t-lead)*var(--u))}
/* 对比：横向并列。best 那项加重，一眼看出哪个更好 */
.cmpw{display:grid;gap:calc(12px*var(--u));flex:1;min-height:0}
.cmpc{background:var(--blk,rgba(255,255,255,.5));border-radius:calc(14px*var(--u));
  padding:calc(12px*var(--u));display:flex;flex-direction:column;gap:calc(4px*var(--u))}
.cmph{display:flex;justify-content:space-between;align-items:center;margin-bottom:calc(4px*var(--u))}
.gi b.best{color:var(--ac)}
/* 进展：状态点是命根子——跑着的和完成的必须一眼分得出 */
.pgw{display:flex;flex-direction:column;gap:calc(12px*var(--u));flex:1;min-height:0}
.pgi{display:flex;flex-direction:column;gap:calc(4px*var(--u))}
.pgh{display:flex;align-items:center;gap:calc(10px*var(--u));font-size:calc(var(--t-body)*var(--u))}
.pgh i{width:calc(12px*var(--u));height:calc(12px*var(--u));border-radius:999px;flex:none}
.pgh i.st-running{background:var(--brand-fg,#1D4ED8);animation:pgpulse 1.4s ease-in-out infinite}
.pgh i.st-done{background:var(--ok-fg,#047857)}
.pgh i.st-failed{background:var(--danger-fg,#B91C1C)}
@keyframes pgpulse{0%,100%{opacity:1}50%{opacity:.35}}
.pgi small{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2);padding-left:calc(22px*var(--u))}
/* 指标：一个大数字 */
.mtw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:calc(8px*var(--u))}
.mtv{display:flex;align-items:baseline;gap:calc(6px*var(--u))}
.mtv b{font-size:calc(var(--t-hero)*var(--u));font-weight:500;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mtv i{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2);font-style:normal}
.mttr{margin-left:auto;font-size:calc(var(--t-cap)*var(--u));color:var(--ok-fg,#047857);font-style:normal}
.mtw small{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2)}
/* 图表：柱状。生成式卡的可预测替代 */
.chw{display:flex;align-items:flex-end;gap:calc(8px*var(--u));flex:1;min-height:calc(60px*var(--u))}
.chw i{flex:1;background:var(--acbg,#EFF6FF);border:1px solid var(--acbd,#BFDBFE);
  border-radius:calc(5px*var(--u)) calc(5px*var(--u)) 0 0;font-style:normal}
.chax{display:flex;justify-content:space-between;font-size:calc(var(--t-cap)*var(--u));
  color:var(--tx-2);margin-top:calc(8px*var(--u))}
/* 图片：frame 档（最接近正方）的主要用户 */
.imw{flex:1;min-height:0;border-radius:calc(16px*var(--u));background-size:cover;
  background-position:center;background-color:var(--blk,rgba(255,255,255,.5))}
.imeta{display:block;font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2);margin-top:calc(4px*var(--u))}

/* ── 绘本卡「路上的故事」 ── */
/* 画面铺满、一句话压底。字号极大——孩子在动的车里不该凑近看 */
.sb{display:flex;flex-direction:column;height:100%;gap:0;margin:calc(-14px*var(--u)) calc(-6px*var(--u)) 0}
/* 图**出血到卡片边缘**（上/左/右），由 .card 的 overflow:hidden + 圆角裁 ——
   浮在白卡里镶白边的那版被实拍判为"一点都不像一个画册" */
.sbart{flex:1.5;min-height:0;overflow:hidden;
  margin:calc(-8px*var(--u)) calc(-20px*var(--u)) 0;
  background:linear-gradient(160deg,#FDE9C0,#C7E0FF)}
/* Ken Burns：极缓慢的推拉，静态图立刻有动画感。纯 CSS，零成本 */
/* 窄档是上图下文，方图铺进一条横带必然裁掉上下 ——
   偏上取景，童书插画的人物基本都在中上部 */
.sbart img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block;
  animation:sbkb 20s ease-in-out infinite alternate}
/* 生成中的占位：.sbart 不是 flex 容器，`flex:1` 在这里无效会塌成 0 高 */
.sbart>.sbwait{height:100%}
@keyframes sbkb{from{transform:scale(1)}to{transform:scale(1.06)}}
/* 左图右文（够宽的档）。两轮实拍：先是「图片没有显示全」，改成分栏之后
   又变成「一点都不像一个画册，图片的上下还有留白」。
   两次都是同一个根因：**图的比例跟它要待的那个框对不上**。

   左栏是满高的一竖条，在默认档上正好是方的 —— 所以画幅改成 1:1，
   art 用 aspect-ratio:1 跟着卡高走，图**恰好填满**：不裁、不留白。
   再把 art 的负边距顶到卡片的内边距之外，图就**出血到卡片边缘**，
   由 .card 的 overflow:hidden + 圆角自己裁 —— 那才是画册，
   而不是一张浮在白卡里、四周镶着白边的缩略图。 */
.sb.side{flex-direction:row;gap:calc(26px*var(--u));align-items:stretch}
/* .card 内边距 22u/26u，.sb 已经吃掉 14u/6u，所以还差 8u（上）/ 20u（左）/ 22u（下） */
.sb.side .sbart{flex:0 0 auto;aspect-ratio:1;border-radius:0;background:transparent;
  margin:calc(-8px*var(--u)) 0 calc(-22px*var(--u)) calc(-20px*var(--u))}
/* 方图进方框，cover 等于原样铺满 —— 一个像素都不裁。Ken Burns 会把边缘推出
   画面，出血版式下推拉反而显得图在"漂"，所以分栏档取消它 */
.sb.side .sbart img{object-fit:cover;animation:none}
.sb.side .sbcap{flex:1;min-width:0;padding:calc(2px*var(--u)) 0 0;
  justify-content:flex-start;gap:calc(12px*var(--u))}
/* 正文在图的高度里垂直居中：靠 auto 外边距，不用 flex 容器 ——
   给 <p> 加 display:flex 会把里面的逐字点亮 <span> 拆成独立 flex item */
.sb.side .sbline{margin-bottom:auto}
.sbcap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(10px*var(--u));
  padding:calc(20px*var(--u)) calc(8px*var(--u)) 0}
.sbch{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2);letter-spacing:.04em}
.sbline{font-size:calc(var(--t-lead)*var(--u));line-height:1.7;font-weight:500}
.sbline .lit{background:var(--pick-bg);border-radius:calc(6px*var(--u));padding:0 calc(4px*var(--u))}
.sbidea{font-size:calc(var(--t-cap)*var(--u));color:var(--warm-fg,var(--tx-2))}
/* 进度点：实心=已生成，加粗=当前，虚线=还在画。**不显示总数** */
.sbfoot{display:flex;align-items:center;justify-content:space-between;gap:calc(16px*var(--u));
  margin-top:auto;padding-bottom:calc(4px*var(--u))}
.sbdots{display:flex;gap:calc(8px*var(--u));align-items:center}
.sbctl{display:flex;gap:calc(18px*var(--u));font-size:calc(var(--t-lead)*var(--u));
  color:var(--ac);cursor:pointer;user-select:none}
.sbdots i{width:calc(10px*var(--u));height:calc(10px*var(--u));border-radius:999px;
  background:var(--n3,#E2E8F0);flex:none}
.sbdots i.on{background:var(--ac);width:calc(28px*var(--u))}
.sbdots i.pend{background:transparent;border:1px dashed var(--n4,#CBD5E1)}
/* 定妆：并排对照——家长要判断的就是"像不像"，不并排没法判断 */
.sbcast{display:flex;height:100%;gap:calc(16px*var(--u));margin-top:calc(-8px*var(--u))}
.sbsrc{width:26%;display:flex;flex-direction:column;gap:calc(8px*var(--u))}
.sbsrc span{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2)}
.sbsrc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:calc(14px*var(--u))}
.sbout{flex:1;display:flex;flex-direction:column;gap:calc(10px*var(--u));min-height:0}
.sbout img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:calc(18px*var(--u))}
.sbout p{font-size:calc(var(--t-body)*var(--u));color:var(--tx-2)}
/* 两个出口：认下来（主）/ 再画一张（次）。定妆是全书唯一要人把关的一步，
   卡上没有出口，家长就只能看着一个不像的主角讲完整本 */
.sbpick{display:flex;gap:calc(10px*var(--u));flex:none}
.sbpick b,.sbpick span{padding:calc(9px*var(--u)) calc(20px*var(--u));border-radius:999px;
  font-size:calc(var(--t-cap)*var(--u));font-weight:600;cursor:pointer;white-space:nowrap}
.sbpick b{background:var(--ac);color:#fff}
.sbpick span{background:var(--n2,#F1F5F9);color:var(--tx-2);font-weight:500}
/* 生成中：模糊到清晰，不用转圈——比 loading 圈高级得多 */
.sbwait{flex:1;border-radius:calc(18px*var(--u));background:linear-gradient(160deg,#FEF3C7,#FED7AA);
  filter:blur(14px);animation:sbpulse 1.6s ease-in-out infinite alternate}
@keyframes sbpulse{from{opacity:.55}to{opacity:.85}}

/* ── 能力目录 ── */
/* 列数由形态函数给（c1/c2/c3），不在 CSS 里硬编码 ——
   写死 3 列的话 form.cols 说 2 列、渲染出 3 列，算出来的容量对不上，
   最后就是切掉半行 */
.cap{flex:1;display:grid;grid-template-columns:1fr;gap:calc(10px*var(--u));
  align-content:start;overflow:hidden}
.cap.c2{grid-template-columns:1fr 1fr}
.cap.c3{grid-template-columns:repeat(3,1fr)}
.cap div{background:linear-gradient(160deg, color-mix(in srgb, var(--acbg) 40%, #fff), #FFFFFF);
  border:1px solid var(--hair-strong,var(--hair));border-left:3px solid var(--acbd);
  border-radius:calc(14px*var(--u));padding:calc(11px*var(--u)) calc(15px*var(--u));
  font-size:calc(var(--t-cap)*var(--u));font-weight:500;color:var(--tx-1,var(--text-primary))}
.cap div small{display:block;color:var(--tx-3,var(--text-secondary));font-size:.82em;margin-top:3px}
.cap .cico{margin-right:calc(8px*var(--u));font-size:1.15em;vertical-align:-1px}
/* 覆盖层关闭钮：临时征用必须有归还的门。命中区 ≥96px（车规） */
.ovclose{margin-left:auto;flex:none;width:calc(96px*var(--u));height:calc(72px*var(--u));
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:calc(34px*var(--u));color:var(--tx-2);border-radius:var(--r-pill,999px)}
.ovclose:active{transform:scale(.92);background:rgba(0,0,0,.06)}
/* 网格模式压成单行条目：banner 档 3 栏 × 4 行，容量公式按半行高算的，
   双行条目会把第 4 行拦腰裁掉——切半行等于骗人 */
.cap.grid div{display:flex;align-items:baseline;white-space:nowrap;overflow:hidden;
  padding:calc(12px*var(--u)) calc(15px*var(--u))}
.cap.grid div small{display:inline;margin:0 0 0 calc(8px*var(--u));overflow:hidden;
  text-overflow:ellipsis;flex:1;min-width:0}
.cap.grid .cico{flex:none}
.cap div.off{opacity:.35;text-decoration:line-through}

/* ══════════ 导航卡：转向条在上、地图居中、关键数字在下 ══════════
   小卡（没有地图）时两块垂直居中，别被推到两端中间空一大片。
   字号跟着 --u 走，不再需要 .sz-1-3 / .sz-1-6 各写一遍。 */
.tpl-nav{overflow:hidden;padding:0}
.tpl-nav>h3{display:none}
/* 目的地兜底行：导航卡最小档没有转向指引时唯一露面的块，不然是条空玻璃条 */
.navdesthead{display:flex;align-items:center;height:100%;overflow:hidden}
.navdesthead b{font-size:calc(var(--t-body)*var(--u));font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* 目的地已在底部呈现，标题重复了 */
.navwrap{display:flex;flex-direction:column;height:100%;gap:0}
.tpl-nav.no-map .navwrap{justify-content:center;gap:calc(6px*var(--u))}
.turnbar{flex:none;display:flex;align-items:center;gap:calc(20px*var(--u));
  padding:calc(20px*var(--u)) calc(28px*var(--u));background:var(--acgr);color:#fff}
.tpl-nav.no-map .turnbar{border-radius:var(--r-m)}
.turnbar .arrow{font-size:calc(var(--t-num)*var(--u));line-height:1;flex:none}
.turntext{display:flex;align-items:baseline;gap:calc(14px*var(--u));min-width:0}
.turntext b{font-size:calc(var(--t-num)*var(--u));font-weight:700;font-variant-numeric:tabular-nums}
.turntext span{font-size:calc(var(--t-body)*var(--u));opacity:.92;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 要进的路名右对齐单独占一栏——它是用户确认没走错的依据，
   不能跟动作挤在一起被省略号吃掉 */
.turnroad{margin-left:auto;font-size:calc(var(--t-cap)*var(--u));opacity:.82;max-width:44%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.mapbox{flex:1;min-height:0;background:var(--sf-sunken,var(--bg-elevated));position:relative;overflow:hidden}
.mapimg{width:100%;height:100%;object-fit:cover;display:block}
/* 高德 JS API 的版权条在车机上是噪音 */
.mapbox .amap-logo,.mapbox .amap-copyright{display:none!important}
.navfoot{flex:none;display:flex;align-items:baseline;gap:calc(32px*var(--u));
  padding:calc(18px*var(--u)) calc(28px*var(--u));flex-wrap:wrap}
.navbig{display:flex;align-items:baseline;gap:calc(6px*var(--u))}
.navbig b{font-size:calc(var(--t-lead)*var(--u));font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--tx-1,var(--text-primary))}
.navbig span{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-3,var(--text-secondary))}
.navdest{margin-left:auto;font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2,var(--text-secondary));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
/* 途经点比终点次一级，但不能小到看不见 */
.navdest em{font-style:normal;display:block;font-size:.78em;opacity:.6;margin-bottom:2px}

/* ══════════ 播放器卡 ══════════
   控制条是**状态指示不是按钮** —— 屏幕不可交互，画成图标就有诱导点击的风险。
   底下那行「说『换一台』就行」把它标回语音能力。 */
/* ── 三段式（重设计 v2）：plhead 元信息带 / plmain 主区 / plfoot 底带 ──
   字阶收敛：标题 33px 实屏（--t-title 级）+ 次行 23px + 注脚 19px——
   量产的高级感不靠大字，靠层级准、密度足、控件收着 */
.plwrap{display:flex;flex-direction:column;height:100%;min-height:0;gap:calc(6px*var(--u))}
.plmain{flex:1;display:flex;align-items:center;gap:calc(26px*var(--u));min-height:0}
.plart{flex:none;width:calc(190px*var(--u));height:calc(190px*var(--u));
  border-radius:calc(16px*var(--u));overflow:hidden;
  background:var(--media-gr,linear-gradient(145deg,#8B5CF6,#6D28D9));
  box-shadow:0 8px 20px -6px rgba(10,30,80,.35),0 1px 3px rgba(10,30,80,.25);
  display:flex;align-items:center;justify-content:center}
.plart.round{border-radius:50%}
.plart img,.plart .videoel{width:100%;height:100%;object-fit:cover;display:block}
/* 小档：封面收小、头尾块自然被 forms 藏掉 */
.t-chip .plart,.t-strip .plart,.t-bar .plart,.t-tile .plart,.t-box .plart{
  width:calc(130px*var(--u));height:calc(130px*var(--u));border-radius:calc(12px*var(--u))}
/* 大档封面上限 260——封面不是主角，信息才是（v2 修订原则②） */
.t-court .plart,.t-stage .plart,.t-full .plart{
  width:calc(230px*var(--u));height:calc(230px*var(--u))}
.plicon{width:46%;height:46%;color:rgba(255,255,255,.9)}
.plicon svg{width:100%;height:100%;stroke-width:1.6}
.plmeta{display:flex;flex-direction:column;gap:calc(5px*var(--u));min-width:0;flex:1}
.plmeta b{font-size:calc(var(--t-title)*var(--u)*1.38);font-weight:600;letter-spacing:.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx-1,var(--text-primary))}
.plmeta > span{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-2,var(--text-secondary));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plfoot{flex:none;display:flex;flex-direction:column;min-height:0}
.plbar{display:flex;align-items:center;gap:calc(14px*var(--u))}
.pltrk{flex:1;height:calc(5px*var(--u));border-radius:99px;background:var(--n3,var(--bg-elevated));
  position:relative;cursor:pointer}
.plfl{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--tx-2,#334155)}
.plknob{position:absolute;top:50%;width:calc(16px*var(--u));height:calc(16px*var(--u));
  border-radius:50%;background:#fff;border:calc(3px*var(--u)) solid var(--tx-2,#334155);
  transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.25);left:0}
.plbar.live .pltrk{background:transparent;cursor:default}
.plbar.live .plknob{display:none}
.pltime{flex:none;font-size:calc(var(--t-cap)*var(--u)*.86);color:var(--tx-3,var(--text-secondary));
  font-variant-numeric:tabular-nums;min-width:calc(60px*var(--u))}
.pltime.pt1{text-align:right}
.pl-next{font-size:calc(var(--t-cap)*var(--u)*.86);color:var(--tx-3,var(--text-secondary));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 视频：画面就是主角——plmain 整个让给画面，控件行沉底 */

.pl-hint{display:flex;align-items:center;gap:calc(8px*var(--u));
  font-size:calc(var(--t-cap)*var(--u));color:var(--tx-3,var(--text-secondary))}
.pl-hint b{font-weight:500;color:var(--ac)}
/* ── 视频（重设计 v2）：画面就是主角——满卡出血，控件沉入底部渐隐浮层 ── */
.card.is-video{padding:0;position:relative;background:#0B0F16}
.card.is-video>h3{display:none}
.card.is-video .plwrap{display:block}
.card.is-video .plmain{position:absolute;inset:0;display:block}
.card.is-video .plart{position:absolute;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none}
.card.is-video .plhead{position:absolute;left:calc(20px*var(--u));top:calc(16px*var(--u));right:calc(20px*var(--u));z-index:2}
.card.is-video .plpos{color:rgba(255,255,255,.65)}
.card.is-video .plmeta{position:absolute;left:calc(26px*var(--u));right:calc(26px*var(--u));
  bottom:calc(150px*var(--u));z-index:2;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.card.is-video .plmeta b{color:#fff;font-size:calc(var(--t-body)*var(--u))}
.card.is-video .plmeta>span{color:rgba(255,255,255,.82)}
.card.is-video .plaux,.card.is-video .pl-next,.card.is-video .plqueue{display:none!important}
.card.is-video .plfoot{position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:calc(40px*var(--u)) calc(24px*var(--u)) calc(14px*var(--u));
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.74))}
.card.is-video .pltime{color:rgba(255,255,255,.65)}
.card.is-video .pltrk{background:rgba(255,255,255,.24)}
.card.is-video .plfl{background:#fff}
.card.is-video .plknob{border-color:#fff;background:#fff}
.card.is-video .plctl .pside{color:rgba(255,255,255,.85)}
.card.is-video .plctl .pmain{background:rgba(255,255,255,.92);color:#0B0F16;box-shadow:none}
.card.is-video .plxtra .pxi{color:rgba(255,255,255,.75)}
.card.is-video .plxtra .pfav{color:#FF7A8C}


/* ── 自动播放解锁遮罩 ── */

/* ── 天气：温度当主角 ── */
.wxnow{display:flex;align-items:center;gap:20px;margin-top:14px}
.wxnow b{font-size:84px;font-weight:300;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.wxnow b i{font-size:44px;font-style:normal;vertical-align:top;opacity:.55}
.wxmeta{display:flex;flex-direction:column;gap:4px;min-width:0}
.wxmeta span{font-size:30px}
.wxmeta small{font-size:21px;color:var(--text-secondary)}
/* 天气预报改走块状均分（.blocks/.blk），不再需要 .wxcast 那一套
   —— 预报本来就是并列数据，跟车窗开度同一个形状。 */

/* ── 短文本卡：白卡 + 左侧 5px 语义色渐变竖条 + 左起淡出底色（§10）──
   整块染色又糊又吵；竖条一眼给出"这是哪类消息"，正文照旧是主角 */
.tpl-feedback::before,.tpl-notice::before,.tpl-info::before{
  content:'';position:absolute;left:0;top:calc(18px*var(--u));bottom:calc(18px*var(--u));
  width:5px;border-radius:0 4px 4px 0;background:var(--acgr)}
.tpl-feedback,.tpl-notice,.tpl-info{
  background:linear-gradient(105deg, color-mix(in srgb, var(--acbg) 42%, rgba(255,255,255,.6)) 0%, rgba(255,255,255,.58) 46%)}

/* ── 短文本卡：正文是主角，不是标题下面的灰色小字 ──
   这几张（续航、正在播放、执行反馈、临时提醒）内容天生就一句话，
   照通用样式渲染的话一行小字挂在顶上，下面 80% 空着，看着像没加载完。
   现在字号跟 --u 走，一张 chip 和一张 banner 用同一条规则。 */
.tpl-info .sub,.tpl-media .sub,.tpl-feedback .sub,.tpl-generic .sub,.tpl-notice .sub{
  flex:1;display:flex;align-items:center;
  font-size:calc(var(--t-lead)*var(--u));line-height:1.25;color:var(--tx-1,var(--text-primary))}

/* ── 确认卡：问句是主体，不是标题下面的小字 ──
   这张卡的意思是「现在轮到你说话了」。问句跟正文一样大的话，
   用户扫一眼不知道系统在等他。选项压到底部，中间留白把两者分开 */
.tpl-confirm .bd{justify-content:space-between}
.tpl-confirm .sub{font-size:calc(var(--t-lead)*var(--u)*1.2);line-height:1.22;
  font-weight:600;color:var(--ac)}
.tpl-confirm .listcard{flex:none}
.tpl-confirm .listcard li{border-bottom:none;padding:calc(4px*var(--u)) 0}
/* 开放问题的提示行：不是按钮，是"轮到你说了"的邀请 */
.askopen{font-size:calc(var(--t-cap)*var(--u));color:var(--tx-3,var(--text-secondary))}

#carWrap{display:flex;align-items:center;justify-content:center}
#carWrap svg{height:100%;max-height:400px}

/* ══════════ 角落蒙层（Avatar 定稿 2026-08-18）══════════
   满宽语音带退役：星河角标住进状态栏左侧，字幕/微字/活动胶囊/确认按钮
   全在顶栏一行内排开，桌面卡片零遮挡。激活时一层透明辉光从左上角洇出——
   蒙层是氛围不是内容，pointer-events 穿透，不挡任何点击 */
#avatar{display:flex;align-items:center;gap:20px;min-width:0;flex:1}
#avatar canvas{width:68px;height:68px;flex:none;cursor:pointer}
#avTag{font-size:24px;color:var(--text-secondary);flex:none;letter-spacing:1px}
#avText{font-size:30px;color:var(--text-primary);font-weight:500;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#avText.user{color:var(--text-secondary)}
#avChips{display:none;gap:10px;flex:none}
[data-s=thinking] #avChips,[data-s=executing] #avChips{display:flex}
#avChips span{font-size:20px;padding:4px 18px;border-radius:999px;white-space:nowrap;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);
  color:var(--text-secondary);animation:chipIn .3s var(--ease)}
@keyframes chipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#avBtns{display:none;gap:14px;flex:none}
[data-s=confirming] #avBtns{display:flex}
#avBtns b{font-size:24px;font-weight:600;padding:8px 34px;border-radius:999px;cursor:pointer;
  background:var(--brand);color:#fff}
#avBtns b+b{background:rgba(255,255,255,.55);color:var(--text-secondary);
  border:1px solid rgba(255,255,255,.6)}
.cursor{display:inline-block;width:3px;height:28px;background:var(--brand);vertical-align:-4px;
  animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* 激活时能力提示胶囊让位给字幕 */
#stage:not([data-s=idle]) .hintpill{display:none}
/* 蒙层：盖在卡片之上、横幅覆盖层之下。确认/拒绝转琥珀——颜色变化余光就能捕捉 */
#veil{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .5s;
  background:radial-gradient(56% 50% at 0% 0%,rgba(77,163,255,.22),rgba(77,163,255,0) 72%)}
#stage:not([data-s=idle]) #veil{opacity:1}
[data-s=confirming] #veil,[data-s=rejected] #veil{
  background:radial-gradient(56% 50% at 0% 0%,rgba(255,184,77,.28),rgba(255,184,77,0) 72%)}

   一次一条排队，按语义色分色 —— 之前拒绝、条件不满足、系统提示、执行完成
   全是同一个橙色，用户分不出「不让做」和「做完了」。

   位置：桌面下沿的留白带。放桌面区顶部试过，它会盖住导航卡的转向条 ——
   那是导航的命根子，任何临时提示都不该压它。
   语音带退场后底部 300px 是横幅的家：贴桌面下沿，不压任何卡。 */
#banner{position:absolute;left:60px;right:60px;bottom:150px;z-index:5;display:none;
  gap:calc(18px*var(--u,1));align-items:flex-start;
  background:var(--acbg);border:2px solid var(--acbd);border-radius:var(--r-m);
  padding:calc(20px*var(--u,1)) calc(28px*var(--u,1));box-shadow:var(--sh-2);--u:1.06;
  transition:bottom .32s var(--ez,var(--ease))}
#banner.on{display:flex;animation:bannerIn var(--d3,.34s) var(--ez-pop,var(--ease))}
@keyframes bannerIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#banner .bico{flex:none;width:calc(44px*var(--u));height:calc(44px*var(--u));
  border-radius:calc(12px*var(--u));background:var(--acgr);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:calc(24px*var(--u))}
#banner .tt{font-size:calc(var(--t-body)*var(--u));color:var(--ac);font-weight:600;
  margin-bottom:calc(4px*var(--u))}
