<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>座舱模拟环境 · 车机屏</title>
<style>
:root{
  /* 日间配色：v0.1 单一浅色主题，不做日夜切换 */
  --bg-base:#EEF1F6;--bg-surface:#FFFFFF;--bg-elevated:#E4E9F0;
  --text-primary:#1B2430;--text-secondary:#5C6675;
  --brand:#1E6FD9;--success:#1B9E68;--warning:#C97A16;--danger:#DB4045;
  --hairline:rgba(20,30,45,.09);--track:#E1E6ED;
  --r-sm:12px;--r-md:20px;--r-lg:32px;--ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#14171C;overflow:hidden;cursor:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  color:var(--text-primary);-webkit-font-smoothing:antialiased}
#vp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:2560px;height:1440px;flex:none;transform-origin:center;
  background:var(--bg-base);position:relative;overflow:hidden}

#statusbar{height:96px;padding:0 60px;display:flex;align-items:center;gap:56px;
  border-bottom:1px solid var(--hairline);font-size:30px;color:var(--text-secondary)}
#statusbar .clock{font-size:36px;color:var(--text-primary);font-weight:500}
#statusbar .sp{flex:1}#statusbar b{color:var(--text-primary);font-weight:500}
.chip{padding:8px 22px;border-radius:999px;background:var(--bg-elevated);font-size:26px;transition:.24s var(--ease)}
.chip.warn{background:rgba(201,122,22,.16);color:var(--warning)}

/* 3列×2行栅格：上行 Agent 区，下行固定区 */
/* 待机时语音区让出高度给桌面：一个球加两个字占掉整屏 21% 是浪费 */
#stage{--voiceH:300px}
#stage[data-s=idle]{--voiceH:148px}
#desk{position:absolute;top:96px;left:0;right:0;bottom:var(--voiceH);padding:24px 60px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:24px;
  transition:bottom .32s var(--ease)}
.zoneTag{position:absolute;left:14px;top:50%;transform:translateY(-50%) rotate(180deg);
  writing-mode:vertical-rl;font-size:18px;color:#D7DCE3;letter-spacing:6px}
.card{background:var(--bg-surface);border-radius:var(--r-lg);padding:28px 32px;overflow:hidden;
  display:flex;flex-direction:column;transition:box-shadow .24s var(--ease),background .24s var(--ease);
  animation:cardIn .32s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.card.hot{background:var(--bg-elevated);box-shadow:0 0 0 3px var(--brand)}
.card h3{font-size:30px;font-weight:600;margin-bottom:16px;color:var(--text-primary)}
.card .sub{font-size:26px;color:var(--text-secondary);line-height:1.5}
.slot{border:2px dashed var(--hairline);border-radius:var(--r-lg)}
.card .rowline{display:flex;justify-content:space-between;align-items:baseline;font-size:26px;margin-bottom:6px}
.card .rowline span{color:var(--text-secondary)}
.card .rowline em{font-style:normal;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.card.hot .rowline em{color:var(--brand)}
.card .opt{display:inline-block;padding:10px 24px;margin:8px 12px 0 0;border-radius:999px;
  background:var(--bg-elevated);font-size:26px;color:var(--text-primary)}
.card .sug{margin-top:12px;font-size:24px;color:var(--brand)}
/* 候选列表：序号让语音选择("第一个")和屏幕对得上号 */
.listcard{list-style:none;counter-reset:pick;margin:0;padding:0;overflow:auto}
.listcard li{counter-increment:pick;display:flex;align-items:baseline;gap:14px;
  padding:12px 0;border-bottom:1px solid var(--hairline)}
.listcard li:last-child{border-bottom:none}
.listcard li::before{content:counter(pick);flex:none;width:40px;height:40px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:24px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.listcard li b{font-size:28px;font-weight:600;color:var(--text-primary)}
.listcard li small{font-size:22px;color:var(--text-secondary)}
/* ── 导航卡：转向条在上、地图居中、关键数字在下 ── */
.tpl-nav{overflow:hidden;padding:0}
.tpl-nav h3{display:none} /* 目的地已在底部呈现，标题重复了 */
.navwrap{display:flex;flex-direction:column;height:100%;gap:0}
.turnbar{flex:none;display:flex;align-items:center;gap:24px;padding:22px 32px;
  background:var(--brand);color:#fff}
.turnbar .arrow{font-size:64px;line-height:1;flex:none}
.turntext{display:flex;align-items:baseline;gap:16px;min-width:0}
.turntext b{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums}
.turntext span{font-size:30px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 要进的路名右对齐单独占一栏——它是用户确认没走错的依据，不能跟动作挤在一起被省略号吃掉 */
.turnroad{margin-left:auto;font-size:28px;opacity:.82;max-width:44%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapbox{flex:1;min-height:0;background:var(--bg-elevated);position:relative;overflow:hidden}
.mapimg{width:100%;height:100%;object-fit:cover;display:block}
/* 高德 JS API 的版权条在车机上是噪音 */
.mapbox .amap-logo,.mapbox .amap-copyright{display:none!important}
.navfoot{flex:none;display:flex;align-items:baseline;gap:40px;padding:20px 32px}
.navbig{display:flex;align-items:baseline;gap:8px}
.navbig b{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.navbig span{font-size:26px;color:var(--text-secondary)}
/* 导航小卡：格子只有一格宽，2/3 的字号会撑破 */
.sz-1-3 .turnbar,.sz-1-6 .turnbar{gap:14px;padding:16px 20px}
.sz-1-3 .turnbar .arrow,.sz-1-6 .turnbar .arrow{font-size:40px}
.sz-1-3 .turntext b,.sz-1-6 .turntext b{font-size:34px}
.sz-1-3 .turntext span,.sz-1-6 .turntext span{font-size:22px}
.sz-1-3 .turnroad,.sz-1-6 .turnroad{font-size:20px;max-width:38%}
.sz-1-3 .navfoot{gap:20px;padding:16px 20px;flex-wrap:wrap}
.sz-1-3 .navbig b{font-size:34px}
.sz-1-3 .navbig span{font-size:20px}
.sz-1-3 .navdest{font-size:22px}
/* 小卡没有地图。两块挨在一起垂直居中，别被推到两端中间空一大片 */
.sz-1-3 .navwrap,.sz-1-6 .navwrap{justify-content:center;gap:4px}
.sz-1-3 .turnbar,.sz-1-6 .turnbar{border-radius:var(--r-md)}
.navdest{margin-left:auto;font-size:28px;color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
/* 途经点比终点次一级，但不能小到看不见 */
.navdest em{font-style:normal;display:block;font-size:.72em;opacity:.6;margin-bottom:2px}
.card.kind-system{box-shadow:0 0 0 3px rgba(201,122,22,.5)}
.card.tpl-notice{background:rgba(201,122,22,.10)}
.card.tpl-notice h3{color:var(--warning)}
.card.tpl-confirm{background:rgba(30,111,217,.08)}
#overlay{position:absolute;top:96px;left:0;right:0;bottom:300px;padding:24px 60px;display:none;z-index:6}
#overlay.on{display:block;animation:cardIn .32s var(--ease)}
#overlay .card{height:100%}
.cap{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px;overflow:auto}
.cap div{background:var(--bg-elevated);border-radius:14px;padding:14px 18px;font-size:24px}
.cap div small{display:block;color:var(--text-secondary);font-size:20px;margin-top:4px}
.cap div.off{opacity:.35;text-decoration:line-through}
/* 一格宽排不下三列，退成一列；再小就只报个数 */
.cap.list{grid-template-columns:1fr;gap:10px}
.cap.list div{padding:10px 14px;font-size:22px}
.cap.list div small{font-size:18px;margin-top:2px}
.capcount{display:flex;align-items:baseline;gap:10px;margin-top:18px}
.capcount b{font-size:76px;font-weight:700;line-height:1}
.capcount span{font-size:26px;color:var(--text-secondary)}

/* ── 播放器卡 ── */
.plwrap{display:flex;align-items:center;gap:24px;height:100%;min-height:0}
.plart{flex:none;width:132px;height:132px;border-radius:18px;overflow:hidden;background:var(--bg-elevated);
  display:flex;align-items:center;justify-content:center}
.plart img,.plart .videoel{width:100%;height:100%;object-fit:cover;display:block}
.plicon{font-size:56px;opacity:.5}
.plmeta{display:flex;flex-direction:column;gap:8px;min-width:0}
.plmeta b{font-size:38px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plmeta span{font-size:26px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sz-1-6 .plwrap{flex-direction:column;align-items:flex-start;justify-content:center;gap:14px}
.sz-1-6 .plart{width:96px;height:96px}
.sz-1-6 .plmeta b{font-size:28px}
.sz-1-6 .plmeta span{font-size:20px}
.sz-1-2 .plart{width:180px;height:180px}
/* 视频占满整张卡，文字压在底部——2/3 是给它准备的大画面 */
.card.is-video{padding:0;position:relative}
.card.is-video h3{display:none}
.card.is-video .plwrap{display:block}
.card.is-video .plart{width:100%;height:100%;border-radius:0}
.card.is-video .plmeta{position:absolute;left:28px;right:28px;bottom:24px;
  text-shadow:0 2px 12px rgba(0,0,0,.6);color:#fff}
.card.is-video .plmeta span{color:rgba(255,255,255,.82)}

/* ── 自动播放解锁遮罩 ── */
#unlock{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
  background:rgba(238,241,246,.94);backdrop-filter:blur(6px);cursor:pointer}
#unlock.gone{display:none}
#unlock div{text-align:center;display:flex;flex-direction:column;gap:12px}
#unlock b{font-size:44px;font-weight:600}
#unlock span{font-size:24px;color:var(--text-secondary)}

/* ── 天气：温度当主角 ── */
.wxnow{display:flex;align-items:center;gap:20px;margin-top:14px}
.wxnow b{font-size:84px;font-weight:300;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.wxnow b i{font-size:44px;font-style:normal;vertical-align:top;opacity:.55}
.wxmeta{display:flex;flex-direction:column;gap:4px;min-width:0}
.wxmeta span{font-size:30px}
.wxmeta small{font-size:21px;color:var(--text-secondary)}
.wxcast{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.wxcast>div{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--hairline)}
.wxcast>div:last-child{border-bottom:none}
.wxcast span{font-size:22px;color:var(--text-secondary);min-width:3.2em}
.wxcast em{font-size:22px;font-style:normal;flex:1}
.wxcast b{font-size:24px;font-variant-numeric:tabular-nums}
/* 宽卡横排，别让内容缩在左上角 */
.wxcast.row{flex-direction:row;gap:14px;margin-top:22px}
.wxcast.row>div{flex:1;flex-direction:column;align-items:flex-start;gap:6px;
  background:var(--bg-elevated);border-radius:16px;padding:16px 18px;border-bottom:none}
.wxcast.row span{min-width:0}
.sz-1-2 .wxnow b{font-size:104px}

/* ── 宽卡多列：内容纵向堆叠会让右半边空着 ── */
.sz-1-2 .listcard{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;align-content:start}
.sz-1-2 .cap.list{grid-template-columns:1fr 1fr}
.sz-1-2 .wins{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;align-content:start}

/* ── 短文本卡：正文是主角，不是标题下面的灰色小字 ──
   这几张（续航、正在播放、执行反馈、临时提醒）内容天生就一句话，
   照通用样式渲染的话一行小字挂在顶上，下面 80% 空着，看着像没加载完 */
.tpl-info .sub,.tpl-media .sub,.tpl-feedback .sub,.tpl-generic .sub{
  flex:1;display:flex;align-items:center;
  font-size:38px;line-height:1.25;color:var(--text-primary);margin-top:8px}
.sz-1-2 .tpl-info .sub,.sz-1-2 .tpl-media .sub,
.sz-1-2 .tpl-feedback .sub,.sz-1-2 .tpl-generic .sub{font-size:46px}

.win{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.win .top{display:flex;justify-content:space-between;align-items:baseline;font-size:26px}
.win .top span{color:var(--text-secondary)}
.win .top em{font-style:normal;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.track{height:18px;border-radius:999px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#2E7FD6,var(--brand))}
.win.hot .top em{color:var(--brand)}

#carWrap{display:flex;align-items:center;justify-content:center}
#carWrap svg{height:100%;max-height:400px}

#voice{position:absolute;left:0;right:0;bottom:0;height:var(--voiceH);display:flex;align-items:center;
  gap:44px;padding:0 80px;border-top:1px solid var(--hairline);transition:height .32s var(--ease);
  background:linear-gradient(180deg,rgba(238,241,246,0),rgba(238,241,246,.92))}
#orbBox{width:180px;height:180px;flex:none;position:relative;display:flex;align-items:center;
  justify-content:center;transition:transform .32s var(--ease),opacity .32s var(--ease)}
#orb{width:132px;height:132px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 32%,#8FCBFF,var(--brand) 55%,#1E5FA8);
  box-shadow:0 0 60px rgba(77,163,255,.5),inset 0 0 30px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;gap:7px;transition:.3s var(--ease)}
#ring{position:absolute;inset:-16px;border-radius:50%;border:3px solid transparent;opacity:0;
  border-top-color:var(--brand);border-right-color:rgba(77,163,255,.3)}
.bar{width:9px;height:20px;border-radius:99px;background:rgba(255,255,255,.92);opacity:0}
[data-s=idle] #orbBox{transform:scale(.62)}
[data-s=idle] #orb{animation:breathe 3.4s ease-in-out infinite;filter:brightness(.55)}
@keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1)}}
[data-s=wakeup] #orb{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(.9)}45%{transform:scale(1.16)}100%{transform:scale(1.04)}}
[data-s=listening] #orb,[data-s=speaking] #orb{transform:scale(1.04)}
[data-s=listening] .bar,[data-s=speaking] .bar{opacity:1;animation:wave .85s ease-in-out infinite}
[data-s=speaking] .bar{animation-duration:.55s}
.bar:nth-child(2){animation-delay:.12s}.bar:nth-child(3){animation-delay:.24s}
.bar:nth-child(4){animation-delay:.36s}.bar:nth-child(5){animation-delay:.48s}
@keyframes wave{0%,100%{height:16px}50%{height:52px}}
[data-s=thinking] #ring{opacity:1;animation:spin 1.05s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[data-s=thinking] #orb{filter:brightness(.8)}
[data-s=executing] #orbBox{transform:scale(.55) translateX(-120px);opacity:.75}
[data-s=confirming] #orb{animation:pulse 1.1s ease-in-out infinite;
  background:radial-gradient(circle at 35% 32%,#FFE0AC,var(--warning) 55%,#B87A16);
  box-shadow:0 0 60px rgba(255,184,77,.5),inset 0 0 30px rgba(255,255,255,.25)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
[data-s=rejected] #orb{background:radial-gradient(circle at 35% 32%,#FFE0AC,var(--warning) 55%,#B87A16);
  box-shadow:0 0 50px rgba(255,184,77,.45);transform:scale(.94)}
#sub{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
#subTag{font-size:26px;color:var(--text-secondary);letter-spacing:2px}
#subText{font-size:44px;line-height:1.42;font-weight:500;min-height:64px}
#subText.user{color:var(--text-secondary)}
.cursor{display:inline-block;width:3px;height:40px;background:var(--brand);vertical-align:-6px;
  animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#reject{position:absolute;left:80px;right:80px;bottom:328px;background:rgba(201,122,22,.12);
  border:2px solid rgba(201,122,22,.4);border-radius:var(--r-md);padding:26px 34px;
  display:none;gap:20px;align-items:flex-start;z-index:5}
#reject.on{display:flex;animation:rise .32s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#reject .tt{font-size:32px;color:var(--warning);font-weight:600;margin-bottom:8px}
#reject .ds{font-size:28px;color:var(--text-secondary);line-height:1.5}
#reject code{background:rgba(0,0,0,.06);padding:3px 12px;border-radius:8px;font-size:24px;color:var(--warning)}
#conn{position:fixed;left:16px;bottom:14px;font-size:12px;color:#AEB6C2;transition:opacity .6s}
</style>
</head>
<body>
<div id="vp"><div id="stage" data-s="idle">
  <div id="statusbar">
    <span class="clock" id="clock">--:--</span>
    <span>车外 <b id="tOut">3</b>°C</span>
    <span id="wx">☁ 多云</span>
    <span class="sp"></span>
    <span class="chip" id="chipSpd">静止 · P 挡</span>
    <span class="chip" id="chipLock" style="display:none">🔒 儿童锁开启</span>
    <span>电量 <b id="soc">68</b>%</span>
  </div>

  <div id="desk"></div>
  <div id="overlay"></div>

  <div id="reject"><div style="font-size:34px">⚠️</div>
    <div><div class="tt" id="rjT"></div><div class="ds" id="rjD"></div></div></div>

  <div id="voice" data-s="idle">
    <div id="orbBox"><div id="ring"></div>
      <div id="orb"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
    </div>
    <div id="sub"><div id="subTag">待机</div><div id="subText"></div></div>
  </div>
</div></div>
<div id="conn">等待控制面板连接…（按 F 全屏）</div>
<!-- 自动播放解锁。浏览器要求页面被交互过才允许出声，而车机屏是被动弹出的窗口，
     不点这一下，第一首歌会被静默拒绝，只在控制台留一句 NotAllowedError -->
<div id="unlock"><div><b>点击激活声音</b><span>车机屏需要一次点击才能播放音频</span></div></div>
<script>
"use strict";
(() => {
  // src/bus.ts
  function createBus(onMsg) {
    let bc = null;
    try {
      bc = new BroadcastChannel("cockpit-sim");
    } catch {
    }
    let peer = null;
    const handle = (m) => {
      if (m && m.type) onMsg(m);
    };
    addEventListener("message", (e) => {
      if (e.data?.type === "hello" && e.source) peer = e.source;
      handle(e.data);
    });
    if (bc) bc.onmessage = (e) => handle(e.data);
    return {
      send(m) {
        try {
          if (peer && !peer.closed) peer.postMessage(m, "*");
        } catch {
        }
        try {
          if (opener) opener.postMessage(m, "*");
        } catch {
        }
        bc?.postMessage(m);
      },
      setPeer(w) {
        peer = w;
      },
      get connected() {
        return !!peer || !!opener;
      }
    };
  }

  // src/screen/turn.ts
  var TURN_ICONS = [
    [/掉头/, "⤺"],
    [/环岛/, "⟳"],
    [/靠左|左前/, "↖"],
    [/靠右|右前/, "↗"],
    [/左转|向左/, "↰"],
    [/右转|向右/, "↱"],
    [/到达|终点/, "◎"]
  ];
  var ACTIONS = [
    "左前方转弯",
    "右前方转弯",
    "向左前方行驶",
    "向右前方行驶",
    "到达目的地",
    "到达途经点",
    "到达终点",
    "左转",
    "右转",
    "掉头",
    "靠左",
    "靠右",
    "直行",
    "进入环岛",
    "驶出环岛"
  ];
  function parseTurn(instruction) {
    const s = instruction.trim();
    const d = s.match(/(\d+(?:\.\d+)?)\s*(米|公里|千米)/);
    const icon = TURN_ICONS.find(([re]) => re.test(s))?.[1] ?? "↑";
    const tail = d ? s.slice(s.indexOf(d[0]) + d[0].length) : s;
    const action = ACTIONS.find((a) => tail.includes(a)) ?? ACTIONS.find((a) => s.includes(a)) ?? s;
    const road = tail.match(/进入(.+?)(?:[，,。]|$)/)?.[1]?.trim() ?? "";
